<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#08090F" />
    <meta name="description" content="Self-hosted AI operations with a human in the loop." />
    <link rel="icon" type="image/png" href="/brand-mark.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SupOps" />
    <title>SupOps</title>
    <script src="/pwa-launch.js"></script>
    <style>
      #splash { display: none; }
      .pwa-launch #splash {
        position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center;
        background: #08090F; transition: opacity .35s ease, visibility .35s;
      }
      #splash.out { opacity: 0; visibility: hidden; }
      #splash .stack { display: grid; justify-items: center; gap: 18px; }
      #splash .mark { position: relative; width: 88px; height: 99px; animation: sp-pop .7s cubic-bezier(.2,.9,.25,1.25) both; }
      #splash .mark img { width: 100%; height: 100%; display: block; filter: drop-shadow(0 0 0 rgba(10,132,255,0)); animation: sp-glow 1.6s ease-in-out .45s infinite; }
      /* A light sweep clipped to the bolt's own shape. */
      #splash .mark::after {
        content: ''; position: absolute; inset: 0;
        background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.85) 50%, transparent 65%) no-repeat;
        background-size: 250% 100%; background-position: 150% 0;
        -webkit-mask: url(/brand-mark.png) center / contain no-repeat; mask: url(/brand-mark.png) center / contain no-repeat;
        animation: sp-sweep .9s ease-out .35s both;
      }
      #splash .word {
        font: 600 20px/1 -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
        letter-spacing: .02em; color: #F5F5F7; animation: sp-rise .5s ease-out .3s both;
      }
      @keyframes sp-pop { 0% { opacity: 0; transform: scale(.55) rotate(-8deg); } 100% { opacity: 1; transform: none; } }
      @keyframes sp-sweep { from { background-position: 150% 0; } to { background-position: -60% 0; } }
      @keyframes sp-glow { 0%, 100% { filter: drop-shadow(0 0 0 rgba(10,132,255,0)); } 50% { filter: drop-shadow(0 0 22px rgba(10,132,255,.55)); } }
      @keyframes sp-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        #splash .mark, #splash .mark img, #splash .mark::after, #splash .word { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="stack">
        <div class="mark"><img src="/brand-mark.png" alt="" /></div>
        <div class="word">SupOps</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
